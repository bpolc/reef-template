# 📄 https://prek.j178.dev/configuration

minimum_prek_version = "0.4.11"
default_install_hook_types = [
    "pre-commit",
    "pre-merge-commit",
]
default_stages = [
    "pre-commit",
    "pre-merge-commit",
    "manual",
]

[update]
cooldown_days = 7
freeze = true

[priorities]
early = 0 # Read-only checks and long-running scans
normalize = 10 # Content normalization
autofix = 20 # First rewrite pass
format = 30 # Second rewrite pass

# BUILTIN HOOKS #
# 📄 https://prek.j178.dev/reference/built-in-hooks/

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=500"]
exclude = { glob = ["*.ipynb", "uv.lock"] }
priority = "early"

[[repos.hooks]]
id = "detect-private-key"
priority = "early"

[[repos.hooks]]
id = "check-symlinks"
priority = "early"

[[repos.hooks]]
id = "destroyed-symlinks"
priority = "early"

[[repos.hooks]]
id = "check-case-conflict"
priority = "early"

[[repos.hooks]]
id = "check-illegal-windows-names"
priority = "early"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]
priority = "early"

[[repos.hooks]]
id = "check-vcs-permalinks"
priority = "early"

[[repos.hooks]]
id = "check-executables-have-shebangs"
priority = "early"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
priority = "early"

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = "normalize"

[[repos.hooks]]
id = "trailing-whitespace"
exclude_types = ["json", "markdown", "toml", "yaml"]
priority = "autofix"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude_types = ["json", "markdown", "toml", "yaml"]
priority = "format"

# LOCAL HOOKS #
# 📄 https://prek.j178.dev/reference/local-hooks/

[[repos]]
repo = "local"

[[repos.hooks]]
id = "dprint-fmt"
name = "format files (dprint)"
entry = "uv run --no-sync dprint fmt --fail-on-change"
language = "system"
types_or = ["json", "markdown", "toml", "yaml"]
# dprint runs in parallel
require_serial = true
priority = "autofix"

# EXTERNAL HOOKS #
# 📄 https://prek.j178.dev/configuration/?h=add+and#add-and-configure-hooks

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
name = "detect hardcoded secrets (gitleaks)"
entry = "gitleaks git --redact --verbose"
pass_filenames = false
always_run = true
stages = ["manual"]
priority = "early"
