# 📄 https://prek.j178.dev/configuration

minimum_prek_version = "0.4.11"
default_install_hook_types = [
    "pre-commit",
]
default_stages = [
    "pre-commit",
]

[priorities]
early = 0 # Read-only checks and long-running scans
normalize = 10 # Content normalization
autofix = 20 # First rewrite pass
format = 30 # Second rewrite pass

# BUILTIN HOOKS #
# 📄 https://prek.j178.dev/reference/built-in-hooks/

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=500"]
exclude = { glob = ["*.ipynb", "uv.lock"] }
priority = "early"

[[repos.hooks]]
id = "detect-private-key"
priority = "early"

[[repos.hooks]]
id = "check-symlinks"
priority = "early"

[[repos.hooks]]
id = "destroyed-symlinks"
priority = "early"

[[repos.hooks]]
id = "check-case-conflict"
priority = "early"

[[repos.hooks]]
id = "check-illegal-windows-names"
priority = "early"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]
priority = "early"

[[repos.hooks]]
id = "check-vcs-permalinks"
priority = "early"

[[repos.hooks]]
id = "check-executables-have-shebangs"
priority = "early"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
priority = "early"

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = "normalize"

[[repos.hooks]]
id = "trailing-whitespace"
priority = "autofix"

[[repos.hooks]]
id = "end-of-file-fixer"
priority = "format"
