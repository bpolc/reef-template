!include includes/pypi_import_names.yml
---
!include includes/python_keywords.yml
---
!include includes/python_versions.yml
---
!include includes/stdlib_module_names.yml
---

_subdirectory: template
_min_copier_version: "9.19.1"
_envops:
    lstrip_blocks: true
    trim_blocks: true

name:
    type: str
    help: Project/package name
    default: "{{ _copier_conf.dst_path.name | default('project', true) }}"
    validator: >-
        {% if not (name | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?\Z')) %}
        Must be a valid Python package name (ASCII)
        {% endif %}

module:
    type: str
    help: Python import name (`src/<module>/`)
    default: "{{ name | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('^(?=[0-9])', '_') }}"
    validator: >-
        {% if not (module | regex_search('^[a-z_][a-z0-9_]*\\Z')) %}
        Must be a lowercase Python identifier (ASCII)
        {% elif module in python_keywords %}
        Must not be a Python keyword
        {% elif module | regex_search('^__.+__\\Z') %}
        Must not be a __dunder__ name
        {% elif module in ['sitecustomize', 'usercustomize'] %}
        Must not be a Python startup hook
        {% elif module in stdlib_module_names %}
        Must not be a Python standard library module
        {% elif module | regex_search('(?i)^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])\\Z') %}
        Must not be a reserved Windows device name
        {% elif module == 'tests' %}
        "tests" is a reserved name
        {% elif not _copier_conf.overwrite and module | lower in pypi_import_names %}
        Must not be a popular PyPI import name
        {% endif %}

description:
    type: str
    help: Short project description (optional)
    default: ""
    validator: >-
        {% if description | regex_search('[\r\n]') %}
        Must fit in one line
        {% endif %}

author_name:
    type: str
    help: Author name (optional)
    default: ""

author_email:
    type: str
    help: Author email (optional)
    default: ""
    validator: >-
        {% if author_email and not (author_email | regex_search('^[^\\s@]+@[^\\s@]+\\.[^\\s@]+\\Z')) %}
        Invalid email address
        {% endif %}

licenses:
    type: str
    help: |-
        Project license(s)
        https://choosealicense.com/licenses/
    multiselect: true
    default: []
    choices:
        - 0BSD
        - AGPL-3.0-only
        - AGPL-3.0-or-later
        - Apache-2.0
        - Artistic-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - BSL-1.0
        - GPL-2.0-only
        - GPL-2.0-or-later
        - GPL-3.0-only
        - GPL-3.0-or-later
        - ISC
        - LGPL-2.1-only
        - LGPL-2.1-or-later
        - LGPL-3.0-only
        - LGPL-3.0-or-later
        - MIT
        - MPL-2.0
        - PSF-2.0
        - Unlicense
        - Zlib

min_python:
    type: str
    help: Minimum Python version
    default: "{{ python_versions[0] }}"
    choices: "{{ python_versions | tojson }}"

task_runner:
    type: str
    help: Task runner
    default: none
    choices:
        - none
        - just

line_width:
    type: int
    help: Maximum line width for formatters
    default: 100
    validator: |-
        {% if line_width < 40 or line_width > 320 %}
        Must be between 40 and 320
        {% endif %}
