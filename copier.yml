_subdirectory: template
_min_copier_version: "9.19.1"
_envops:
    lstrip_blocks: true
    trim_blocks: true

name:
    type: str
    help: Project/package name
    default: "{{ _copier_conf.dst_path.name | default('project', true) }}"
    validator: >-
        {% if not (name | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?\Z')) %}
        Must be a valid Python package name (ASCII)
        {% endif %}

module:
    type: str
    help: Python import name (`src/<module>/`)
    placeholder: my_project
    validator: >-
        {% if not (module | regex_search('^[a-z_][a-z0-9_]*\Z')) %}
        Must be a lowercase Python identifier (ASCII)
        {% elif module | regex_search('(?i)^(?:con|prn|aux|nul|com[0-9]|lpt[0-9])\Z') %}
        Must not be a reserved Windows device name
        {% endif %}

description:
    type: str
    help: Short project description
    default: ""

author_name:
    type: str
    help: Author name
    default: ""

author_email:
    type: str
    help: Author email
    default: ""

python_versions:
    type: yaml
    when: false
    default:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"

min_python:
    type: str
    help: Minimum Python version
    default: "{{ python_versions[0] }}"
    choices: "{{ python_versions | tojson }}"

task_runner:
    type: str
    help: Task runner
    default: none
    choices:
        - none
        - just

line_width:
    type: int
    help: Maximum line width for formatters
    default: 100
    validator: |-
        {% if line_width < 40 or line_width > 320 %}
        Line width must be between 40 and 320
        {% endif %}
