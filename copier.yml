_subdirectory: template
_templates_suffix: .jinja
_envops:
    keep_trailing_newline: true
    lstrip_blocks: true
    trim_blocks: true
_exclude:
    - ".git"

name:
    type: str
    help: Project/package name
    placeholder: my-project
    default: "{{ _copier_conf.dst_path.name | default('project', true) }}"

module:
    type: str
    help: Python import name (`src/<module>/`)
    placeholder: my_project

description:
    type: str
    help: Short project description
    default: ""

author_name:
    type: str
    help: Author name
    default: ""

author_email:
    type: str
    help: Author email
    default: ""

python_versions:
    type: yaml
    help: Supported Python versions, oldest first
    when: false
    default:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"

min_python:
    type: str
    help: Minimum Python version
    default: "{{ python_versions[0] }}"
    choices: "{{ python_versions | tojson }}"

line_width:
    type: int
    help: Maximum line width for formatters
    default: 100
    validator: |-
        {% if line_width < 40 or line_width > 320 %}
        Line width must be between 40 and 320
        {% endif %}
